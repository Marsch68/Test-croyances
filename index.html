<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Boussole Philosophique et Religieuse</title>
  
  <!-- Librairie Chart.js pour le graphique Radar -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* ----- CSS : Typographie, Couleurs et Variables (Modern UI) ----- */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    :root {
      --bg-color: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    #app-container {
      background: var(--card-bg);
      max-width: 650px;
      width: 100%;
      padding: 40px;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      transition: all 0.3s ease;
    }

    /* ----- Zone Sondage ----- */
    #progress-text {
      font-size: 0.85em;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    #question-texte {
      font-size: 1.4em;
      line-height: 1.5;
      margin-bottom: 35px;
      min-height: 90px;
      font-weight: 600;
      color: #0f172a;
    }

    .choices-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-choix {
      appearance: none;
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 16px 20px;
      font-size: 1.05em;
      font-family: inherit;
      color: var(--text-main);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease-in-out;
      box-shadow: var(--shadow-sm);
    }

    .btn-choix:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
    .btn-choix:active { transform: translateY(1px); }

    .btn-decouverte {
      background: linear-gradient(135deg, #f59e0b, #f97316) !important;
      color: white !important;
      border: none !important;
      margin-top: 20px !important;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    .btn-decouverte:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }

    .btn-retour {
      background-color: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      margin-top: 25px;
      font-size: 0.95em;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-retour:hover { color: var(--text-main); text-decoration: underline; }

    /* ----- Écran de Résultats ----- */
    #resultats { display: none; }
    #resultats h2 { font-size: 1.8em; color: #0f172a; margin-bottom: 30px; }

    #bloc-dissonance-global {
      margin-bottom: 25px;
      padding: 25px;
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      text-align: center;
      transition: all 0.3s ease;
    }
    #titre-dissonance {
      font-size: 0.85em;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    #valeur-dissonance { font-size: 3.5em; font-weight: 700; margin: 5px 0 15px 0; line-height: 1; }
    #texte-dissonance { font-size: 1em; margin: 0; color: var(--text-main); line-height: 1.5; }
    
    #bloc-synthese {
      background-color: #f0f9ff;
      border-left: 5px solid var(--primary);
      padding: 25px;
      margin-bottom: 35px;
      text-align: left;
      border-radius: 0 12px 12px 0;
      font-size: 1.05em;
      line-height: 1.7;
      color: #0f172a;
      box-shadow: var(--shadow-sm);
    }
    #bloc-synthese h3 {
      margin-top: 0; color: var(--primary); font-size: 1.1em;
      margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;
    }

    .chart-container { position: relative; width: 100%; max-width: 450px; margin: 0 auto 40px auto; }
    
    /* ----- Barres d'affinités ----- */
    .resultat-item { margin-bottom: 25px; text-align: left; }
    .resultat-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; color: #334155; }
    .barre-fond { width: 100%; background-color: #e2e8f0; border-radius: 8px; overflow: hidden; height: 14px; }
    .barre-remplissage {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #60a5fa);
      border-radius: 8px;
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* ----- Alertes Dissonance ----- */
    #alertes-dissonance {
      margin-top: 35px; padding: 20px; background-color: #fff7ed;
      border-left: 5px solid #f97316; text-align: left;
      border-radius: 0 12px 12px 0; box-shadow: var(--shadow-sm);
    }
    .alerte-item { margin-bottom: 12px; font-size: 0.95em; line-height: 1.6; }

    /* ----- Boîte Blanche (Audit) ----- */
    #bloc-logique {
      display: none; margin-top: 30px; padding: 25px; background-color: #f8fafc; 
      border: 2px dashed #cbd5e1; border-radius: 12px; text-align: left; 
      font-size: 0.95em; color: #334155;
    }
    #bloc-logique li {
      margin-bottom: 20px; padding: 20px; background: #ffffff; 
      border-radius: 8px; border-left: 4px solid var(--primary);
      box-shadow: var(--shadow-sm);
    }

    @media print {
      body { background-color: #fff; padding: 0; }
      #app-container { box-shadow: none; max-width: 100%; padding: 0; }
      .zone-boutons-fin { display: none !important; }
      #bloc-dissonance-global, .barre-fond, .barre-remplissage, #bloc-synthese, #alertes-dissonance, #bloc-logique {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
      }
      .chart-container, .resultat-item, #bloc-dissonance-global, #bloc-synthese {
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- ÉCRAN DU SONDAGE -->
    <div id="sondage">
      <div id="progress-text">Initialisation...</div>
      <div id="question-texte">Chargement des données...</div>
      <div id="choices-container" class="choices-grid"></div>
      <div id="nav-container"></div>
    </div>

    <!-- ÉCRAN DES RÉSULTATS -->
    <div id="resultats">
      <h2>Vos Résultats</h2>
      
      <div id="bloc-dissonance-global">
        <div id="titre-dissonance">Indice de Dissonance Cognitive</div>
        <div id="valeur-dissonance">0%</div>
        <p id="texte-dissonance"></p>
      </div>

      <div id="bloc-synthese" style="display: none;">
        <h3>Analyse de votre profil</h3>
        <div id="texte-synthese-redigee"></div>
      </div>

      <div class="chart-container">
        <canvas id="radarChart"></canvas>
      </div>

      <div id="affinites-container"></div>

      <div id="alertes-dissonance" style="display: none;">
        <h3 style="margin-top: 0; color: #d35400;">Contradictions philosophiques détectées :</h3>
        <div id="alertes-liste"></div>
      </div>

      <!-- Zone de boutons de fin -->
      <div class="zone-boutons-fin" style="display: flex; gap: 15px; justify-content: center; margin-top: 40px; flex-wrap: wrap;">
        <button class="btn-choix" style="border-color: #95a5a6; font-weight: bold;" onclick="imprimerResultats()">🖨️ Imprimer / PDF</button>
        <button class="btn-choix" id="btn-partage" style="border-color: #f39c12; background-color: #fcf3cf; font-weight: bold; color: #d35400;" onclick="partagerResultats()">🔗 Partager mes résultats</button>
        <button class="btn-choix" style="border-color: #8e44ad; background-color: #f4ecf7; font-weight: bold; color: #8e44ad;" onclick="basculerLogique()">🧠 Comprendre mon résultat</button>
        <button class="btn-choix" style="border-color: var(--primary); font-weight: bold;" onclick="recommencerSondage()">↺ Refaire le test</button>
      </div>
      
      <!-- Rapport d'audit algorithmique -->
      <div id="bloc-logique">
        <h3 style="color: #2c3e50; margin-top: 0; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;">Transparence de l'Algorithme</h3>
        <div id="contenu-logique"></div>
      </div>

    </div>
  </div>

  <script>
    // --- VARIABLES GLOBALES ---
    let toutesQuestions = [];
    let toutesDissonances = [];
    
    let reponsesUtilisateur = {};
    let fileAttente = [];
    let questionsDisponibles = [];
    let indexCourant = 0;
    
    let modeAlgorithme = "hasard"; // "hasard", "contradiction" ou "renfort"
    let profilEnTest = null;
    let radarChartInstance = null;

    const elProgress = document.getElementById("progress-text");
    const elQuestionTexte = document.getElementById("question-texte");
    const elChoicesContainer = document.getElementById("choices-container");
    const elNavContainer = document.getElementById("nav-container");

    // --- INITIALISATION (Chargement JSON externe) ---
    async function initApp() {
      try {
        const response = await fetch('sondage.json');
        if (!response.ok) throw new Error("Fichier non trouvé");
        const data = await response.json();
        
        toutesQuestions = data.questions;
        toutesDissonances = data.dissonances;

        const questionIdentite = toutesQuestions.find(q => q.type === "identite");
        if (questionIdentite) {
          fileAttente.push(questionIdentite);
          afficherQuestion();
        } else {
          elQuestionTexte.textContent = "Erreur : Question d'identité introuvable.";
        }
      } catch (error) {
        console.error(error);
        elProgress.textContent = "Erreur fatale";
        elQuestionTexte.textContent = "Impossible de charger la base de données sondage.json. Si vous êtes en local, ouvrez l'application via un serveur (Live Server).";
      }
    }

    // --- AFFICHAGE DE LA QUESTION ---
    function afficherQuestion() {
      const q = fileAttente[indexCourant];
      elQuestionTexte.textContent = q.texte;
      elChoicesContainer.innerHTML = ""; 
      elNavContainer.innerHTML = "";

      if (q.type === "identite") {
        elProgress.textContent = "Introduction";
        q.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "btn-choix";
          btn.textContent = opt.label;
          if (opt.valeur === "sans_apriori") btn.classList.add("btn-decouverte");
          btn.onclick = () => traiterIdentite(opt.valeur, q.id);
          elChoicesContainer.appendChild(btn);
        });
        
      } else if (q.type === "qcm") {
        elProgress.textContent = `Question ${indexCourant} / ${fileAttente.length - 1}`;
        q.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "btn-choix";
          btn.textContent = opt.label;
          btn.onclick = () => {
             reponsesUtilisateur[q.id] = { type: "qcm", scores: opt.scores };
             preparerQuestionSuivante();
          };
          elChoicesContainer.appendChild(btn);
        });
        
      } else {
        elProgress.textContent = `Question ${indexCourant} / ${fileAttente.length - 1}`;
        const echelle = [
          { val: 2, label: "Tout à fait d'accord" },
          { val: 1, label: "Plutôt d'accord" },
          { val: 0, label: "Neutre / Sans opinion" },
          { val: -1, label: "Plutôt pas d'accord" },
          { val: -2, label: "Pas du tout d'accord" }
        ];

        echelle.forEach(item => {
          const btn = document.createElement("button");
          btn.className = "btn-choix";
          btn.textContent = item.label;
          btn.onclick = () => enregistrerChoix(item.val, q.id); 
          elChoicesContainer.appendChild(btn);
        });
      }

      if (indexCourant > 0) {
        const btnRetour = document.createElement("button");
        btnRetour.className = "btn-retour";
        btnRetour.textContent = "← Retour à la question précédente";
        btnRetour.onclick = questionPrecedente;
        elNavContainer.appendChild(btnRetour);
      }
    }
    // --- FONCTION UTILITAIRE (MANQUANTE) ---
    function melangerTableau(array) {
      const nouveauTableau = [...array];
      for (let i = nouveauTableau.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [nouveauTableau[i], nouveauTableau[j]] = [nouveauTableau[j], nouveauTableau[i]];
      }
      return nouveauTableau;
    }

    function traiterIdentite(valeurIdentite, qId) {
      reponsesUtilisateur[qId] = valeurIdentite;
      let questionsPourTest = [];
      
      if (valeurIdentite === "sans_apriori") {
          questionsPourTest = toutesQuestions.filter(q => q.type === "standard" || q.type === "qcm");
      } else {
          const crashTests = toutesQuestions.filter(q => q.type === "crash_test" && q.cible_identite === valeurIdentite);
          const questionsStandards = toutesQuestions.filter(q => q.type === "standard" || q.type === "qcm");
          questionsPourTest = [...crashTests, ...questionsStandards];
      }
      
      questionsDisponibles = melangerTableau(questionsPourTest);
      preparerQuestionSuivante();
    }

    // --- LE MOTEUR ADAPTATIF ---
    function enregistrerChoix(valeur, qId) {
      reponsesUtilisateur[qId] = valeur;
      
      const qActuelle = fileAttente[indexCourant];
      if (qActuelle.type === "crash_test") {
        if (valeur < 1) { 
          modeAlgorithme = "contradiction"; 
        } else {
          modeAlgorithme = "renfort";
        }
        
        let candidats = Object.keys(qActuelle.scores);
        profilEnTest = candidats[0];
      } else {
        modeAlgorithme = "hasard";
      }

      preparerQuestionSuivante();
    }

    function preparerQuestionSuivante() {
      if (questionsDisponibles.length === 0) {
        if (indexCourant === fileAttente.length - 1) {
          terminerSondage();
          return;
        } else {
          indexCourant++;
          afficherQuestion();
          return;
        }
      }

      let indexProchaine = -1;

      if (modeAlgorithme === "contradiction" && profilEnTest) {
        indexProchaine = questionsDisponibles.findIndex(q => q.scores && q.scores[profilEnTest] < 0);
      } else if (modeAlgorithme === "renfort" && profilEnTest) {
        indexProchaine = questionsDisponibles.findIndex(q => q.scores && q.scores[profilEnTest] > 0);
      }

      if (indexProchaine === -1) {
        indexProchaine = Math.floor(Math.random() * questionsDisponibles.length);
      }

      const qSuivante = questionsDisponibles.splice(indexProchaine, 1)[0];
      
      if (indexCourant < fileAttente.length - 1) {
        fileAttente.length = indexCourant + 1;
      }
      
      fileAttente.push(qSuivante);
      indexCourant++;
      afficherQuestion();
    }

    function questionPrecedente() {
      if (indexCourant > 0) {
        indexCourant--;
        const qActuelle = fileAttente[indexCourant];
        delete reponsesUtilisateur[qActuelle.id];
        afficherQuestion();
      }
    }

    // --- FIN ET CALCUL DES RÉSULTATS ---
    function terminerSondage() {
      document.getElementById("sondage").style.display = "none";
      document.getElementById("resultats").style.display = "block";

      const affinites = calculerAffinities(reponsesUtilisateur);
      dessinerGraphique(affinites);

      const affinitesContainer = document.getElementById("affinites-container");
      affinitesContainer.innerHTML = "";

      affinites.forEach(a => {
        const item = document.createElement("div");
        item.className = "resultat-item";
        item.innerHTML = `
          <div class="resultat-header">
            <span>${a.profil.replace(/_/g, ' ')}</span>
            <span>${a.pourcentage}%</span>
          </div>
          <div class="barre-fond">
            <div class="barre-remplissage" style="width: 0%"></div>
          </div>
        `;
        affinitesContainer.appendChild(item);
        
        setTimeout(() => {
          item.querySelector(".barre-remplissage").style.width = a.pourcentage + "%";
        }, 100);
      });

      const alertes = evaluerDissonances(reponsesUtilisateur);
      const valDissonance = document.getElementById("valeur-dissonance");
      const texteDissonance = document.getElementById("texte-dissonance");
      const divAlertes = document.getElementById("alertes-dissonance");
      const listeAlertes = document.getElementById("alertes-liste");

      let pourcentageDissonance = Math.min(alertes.length * 15, 100);
      valDissonance.textContent = pourcentageDissonance + "%";
      
      if (pourcentageDissonance === 0) {
        valDissonance.style.color = "#27ae60";
        texteDissonance.innerHTML = "Félicitations. Votre pensée est d'une grande cohérence logique et architecturale.";
        divAlertes.style.display = "none";
      } else if (pourcentageDissonance <= 30) {
        valDissonance.style.color = "#f39c12";
        texteDissonance.innerHTML = "Une pensée globale structurée, malgré quelques tensions philosophiques.";
      } else {
        valDissonance.style.color = "#c0392b";
        texteDissonance.innerHTML = "Votre système de pensée est fracturé par des croyances fondamentalement incompatibles.";
      }

      if (alertes.length > 0) {
        divAlertes.style.display = "block";
        listeAlertes.innerHTML = alertes.map(a => `<div class="alerte-item">${a}</div>`).join('');
      }

      function genererTexteSynthese(affinites, alertes, pourcentageDissonance) {
      const bloc = document.getElementById("bloc-synthese");
      const texte = document.getElementById("texte-synthese-redigee");
      bloc.style.display = "block";

      if (affinites.length === 0) {
        texte.innerHTML = "Vos réponses sont trop neutres ou dispersées pour dégager une doctrine ou une philosophie dominante.";
        return;
      }

      const dom1 = affinites[0].profil;
      const nomDom1 = dom1.replace(/_/g, ' ');
      
      let redaction = `Votre logiciel idéologique s'articule prioritairement autour du <strong>${nomDom1}</strong>. `;
      
      let dom2 = null;
      let nomDom2 = "";
      if (affinites.length > 1 && affinites[1].pourcentage > 0) {
        dom2 = affinites[1].profil;
        nomDom2 = dom2.replace(/_/g, ' ');
        redaction += `Il est également fortement teinté de <strong>${nomDom2}</strong>.`;
      }

      // --- AJOUT DES DÉFINITIONS DU DICTIONNAIRE ---
      redaction += `<br><br><div style="background-color: #ffffff; padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary); margin: 15px 0; font-size: 0.95em;">`;
      redaction += `<strong style="color: var(--primary);">📌 Ce que cela signifie :</strong><br><br>`;
      
      const desc1 = descriptionsProfils[dom1] || "Une approche philosophique riche et complexe.";
      redaction += `<strong>${nomDom1} :</strong> ${desc1}`;

      if (dom2) {
        const desc2 = descriptionsProfils[dom2] || "Une doctrine complémentaire influente dans votre pensée.";
        redaction += `<br><br><strong>${nomDom2} :</strong> ${desc2}`;
      }
      redaction += `</div>`;
      // ---------------------------------------------

      if (pourcentageDissonance === 0) {
        redaction += "Ce socle est remarquablement stable : vous n'avez validé aucun paradoxe logique ou métaphysique flagrant lors de ce test. Vos réponses sont d'une grande cohérence architecturale.";
      } else if (pourcentageDissonance <= 30) {
        redaction += `Bien que votre ligne directrice soit claire, le test a relevé une légère porosité intellectuelle. L'algorithme a notamment détecté la dissonance suivante : <br><em>"${alertes[0].split('</strong>')[0].replace('<strong>', '')}"</em>.`;
      } else {
        redaction += `Toutefois, cette dominante cache un profond chaos architectural. Votre système de pensée emprunte des concepts qui s'excluent mutuellement dans la réalité logique. Votre contradiction la plus violente concerne : <br><em>"${alertes[0].split('</strong>')[0].replace('<strong>', '')}"</em>.`;
      }

      texte.innerHTML = redaction;
    }
      const resultats = [];
      // Bouclier à 10 points
      for (const profil in totaux) {
        if (maxPossibles[profil] >= 10) {
          let ratio = totaux[profil] / maxPossibles[profil];
          if (ratio < 0) ratio = 0;
          let pourcentage = Math.pow(ratio, 2) * 100;
          resultats.push({ profil: profil, pourcentage: Math.round(pourcentage) });
        }
      }
      
      return resultats.sort((a, b) => b.pourcentage - a.pourcentage);
    }

    function evaluerDissonances(rep) {
      const alertes = [];
      toutesDissonances.forEach(regle => {
        try {
          const evalFunction = new Function('rep', `return ${regle.condition};`);
          if (evalFunction(rep)) {
            alertes.push(regle.message);
          }
        } catch (e) { console.error("Erreur règle :", regle.code, e); }
      });
      return alertes;
    }

    function dessinerGraphique(affinites) {
      const ctx = document.getElementById('radarChart').getContext('2d');
      if (radarChartInstance) radarChartInstance.destroy();
      
      const top6 = affinites.slice(0, 6);
      const labels = top6.map(a => a.profil.replace(/_/g, ' '));
      const data = top6.map(a => a.pourcentage);

      let couleurFond = 'rgba(59, 130, 246, 0.3)';
      let couleurBord = 'rgba(59, 130, 246, 1)';
      
      if (top6.length > 0) {
        const profilDominant = top6[0].profil;
        if (profilDominant.includes('Bouddhisme')) {
          couleurFond = 'rgba(230, 126, 34, 0.4)'; couleurBord = 'rgba(230, 126, 34, 1)';
        } else if (profilDominant.includes('Islam') || profilDominant.includes('Soufisme')) {
          couleurFond = 'rgba(46, 204, 113, 0.4)'; couleurBord = 'rgba(46, 204, 113, 1)';
        } else if (profilDominant.includes('Athéisme') || profilDominant.includes('Matérialisme') || profilDominant.includes('Épicurisme') || profilDominant.includes('Nietzschéisme')) {
          couleurFond = 'rgba(239, 68, 68, 0.4)'; couleurBord = 'rgba(239, 68, 68, 1)';
        } else if (profilDominant.includes('Catholicisme') || profilDominant.includes('Protestantisme') || profilDominant.includes('Calvinisme') || profilDominant.includes('Christianisme')) {
          couleurFond = 'rgba(168, 85, 247, 0.4)'; couleurBord = 'rgba(168, 85, 247, 1)';
        } else if (profilDominant.includes('Existentialisme') || profilDominant.includes('Agnosticisme')) {
          couleurFond = 'rgba(148, 163, 184, 0.4)'; couleurBord = 'rgba(148, 163, 184, 1)';
        } else if (profilDominant.includes('Spinozisme') || profilDominant.includes('Panthéisme') || profilDominant.includes('Stoïcisme') || profilDominant.includes('Déisme')) {
          couleurFond = 'rgba(14, 165, 233, 0.4)'; couleurBord = 'rgba(14, 165, 233, 1)';
        }
      }

      radarChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Affinité (%)', data: data,
            backgroundColor: couleurFond, borderColor: couleurBord,
            pointBackgroundColor: '#fff', pointBorderColor: couleurBord,
            pointHoverBackgroundColor: couleurBord, pointHoverBorderColor: '#fff', borderWidth: 2
          }]
        },
        options: {
          scales: {
            r: {
              angleLines: { color: 'rgba(0, 0, 0, 0.1)' },
              grid: { color: 'rgba(0, 0, 0, 0.1)' },
              pointLabels: { font: { size: 12, family: "'Inter', sans-serif", weight: '600' }, color: '#475569' },
              ticks: { display: false, min: 0, max: 100 }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function genererTexteSynthese(affinites, alertes, pourcentageDissonance) {
      const bloc = document.getElementById("bloc-synthese");
      const texte = document.getElementById("texte-synthese-redigee");
      bloc.style.display = "block";

      if (affinites.length === 0) {
        texte.innerHTML = "Vos réponses sont trop neutres ou dispersées pour dégager une doctrine dominante.";
        return;
      }

      const dom1 = affinites[0].profil.replace(/_/g, ' ');
      let redaction = `Votre logiciel idéologique s'articule prioritairement autour du <strong>${dom1}</strong>. `;
      
      if (affinites.length > 1 && affinites[1].pourcentage >= 50) {
        const dom2 = affinites[1].profil.replace(/_/g, ' ');
        redaction += `Il est fortement teinté de <strong>${dom2}</strong>. `;
      }

      if (pourcentageDissonance === 0) {
        redaction += "<br><br>Ce socle est remarquablement stable : vous n'avez validé aucun paradoxe logique ou métaphysique flagrant lors de ce test.";
      } else if (pourcentageDissonance <= 30) {
        redaction += `<br><br>Bien que votre ligne directrice soit claire, le test a relevé une légère porosité intellectuelle. L'algorithme a notamment détecté la dissonance suivante : <em>${alertes[0].split('</strong>')[0].replace('<strong>', '')}</em>.`;
      } else {
        redaction += `<br><br>Toutefois, cette dominante cache un profond chaos architectural. Votre système de pensée emprunte des concepts qui s'excluent mutuellement dans la réalité logique. Votre contradiction la plus violente concerne : <em>${alertes[0].split('</strong>')[0].replace('<strong>', '')}</em>.`;
      }

      texte.innerHTML = redaction;
    }

    function basculerLogique() {
      const bloc = document.getElementById("bloc-logique");
      const contenu = document.getElementById("contenu-logique");
      if (bloc.style.display === "block") { bloc.style.display = "none"; return; }
      
      bloc.style.display = "block";
      let html = "<p>Voici la décomposition exacte des points attribués en coulisses :</p><ul style='padding-left: 0; list-style-type: none;'>";
      
      for (const [qId, rep] of Object.entries(reponsesUtilisateur)) {
        if (qId === "q_identite") continue; 
        const qDef = toutesQuestions.find(q => q.id === qId);
        if (!qDef) continue;
        
        html += `<li style="margin-bottom: 20px; padding: 15px; background: #ffffff; border-radius: 8px; border-left: 4px solid var(--primary); box-shadow: var(--shadow-sm);">
                   <strong>Question :</strong> <em>${qDef.texte}</em><br>`;
                   
        if (typeof rep === "object" && rep.type === "qcm") {
           const optionChoisie = qDef.options.find(opt => JSON.stringify(opt.scores) === JSON.stringify(rep.scores));
           html += `<strong style="color: var(--primary);">Votre choix :</strong> ${optionChoisie ? optionChoisie.label : "Option QCM"}<br><strong>Points attribués :</strong> `;
           const impacts = [];
           for (const [profil, pts] of Object.entries(rep.scores)) {
             const couleur = pts > 0 ? '#16a34a' : '#dc2626';
             impacts.push(`${profil.replace(/_/g, ' ')} (<span style="color: ${couleur}; font-weight:bold;">${pts > 0 ? '+' : ''}${pts}</span>)`);
           }
           html += impacts.length > 0 ? impacts.join(', ') : "Aucun";
        } 
        else if (typeof rep === "number") {
           const mapReponse = { "2": "Tout à fait d'accord (x2)", "1": "Plutôt d'accord (x1)", "0": "Neutre (Ignoré)", "-1": "Plutôt pas d'accord (x-1)", "-2": "Pas du tout d'accord (x-2)" };
           html += `<strong style="color: var(--primary);">Votre choix :</strong> ${mapReponse[rep]}<br>`;
           if (rep !== 0 && qDef.scores) {
             html += `<strong>Points attribués :</strong> `;
             const impacts = [];
             for (const [profil, poids] of Object.entries(qDef.scores)) {
               const pts = poids * rep;
               const couleur = pts > 0 ? '#16a34a' : '#dc2626';
               impacts.push(`${profil.replace(/_/g, ' ')} (<span style="color: ${couleur}; font-weight:bold;">${pts > 0 ? '+' : ''}${pts}</span>)`);
             }
             html += impacts.join(', ');
           }
        }
        html += `</li>`;
      }
      html += "</ul>";
      contenu.innerHTML = html;
      bloc.scrollIntoView({ behavior: 'smooth' });
    }

      reponsesUtilisateur = {};

      questionsDisponibles = [];

      const questionIdentite = toutesQuestions.find(q => q.type === "identite");

        fileAttente.push(questionIdentite);
        afficherQuestion();
      }
    }
