<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boussole Philosophique & Religieuse</title>
  <style>
    /* ----- CSS : Typographie et Mise en page ----- */
    :root {
      --bg-color: #f4f4f9;
      --text-main: #2c3e50;
      --btn-bg: #ffffff;
      --btn-hover: #eef2f5;
      --border-color: #dcdde1;
      --primary: #3498db;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    #app-container {
      background: #fff;
      max-width: 600px;
      width: 90%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
    }

    #progress-text {
      font-size: 0.9em;
      color: #7f8c8d;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #question-texte {
      font-size: 1.3em;
      line-height: 1.5;
      margin-bottom: 30px;
      min-height: 80px;
      font-weight: 500;
    }

    .choices-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-choix {
      appearance: none;
      background-color: var(--btn-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      font-size: 1em;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-choix:hover {
      background-color: var(--btn-hover);
      border-color: var(--primary);
    }

    .btn-choix[data-val="-2"]:hover { border-color: #e74c3c; background-color: #fadbd8; }
    .btn-choix[data-val="-1"]:hover { border-color: #e67e22; background-color: #fdebd0; }
    .btn-choix[data-val="0"]:hover  { border-color: #95a5a6; background-color: #f2f4f4; }
    .btn-choix[data-val="1"]:hover  { border-color: #2ecc71; background-color: #d5f5e3; }
    .btn-choix[data-val="2"]:hover  { border-color: #27ae60; background-color: #abebc6; }

    .btn-retour {
      background-color: transparent;
      border: none;
      color: #7f8c8d;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 20px;
      font-size: 0.95em;
      transition: color 0.2s;
    }
    .btn-retour:hover {
      color: var(--text-main);
    }

    #resultats { display: none; }
    
    .resultat-item {
      margin-bottom: 20px;
      text-align: left;
    }
    .resultat-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .barre-fond {
      width: 100%;
      background-color: var(--btn-hover);
      border-radius: 6px;
      overflow: hidden;
      height: 12px;
    }
    .barre-remplissage {
      height: 100%;
      background-color: var(--primary);
      transition: width 1s ease-out;
    }
    
    #alertes-dissonance {
      margin-top: 30px;
      padding: 15px;
      background-color: #fdf2e9;
      border-left: 4px solid #e67e22;
      text-align: left;
      border-radius: 0 8px 8px 0;
    }
    .alerte-item { margin-bottom: 10px; font-size: 0.95em; }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="sondage">
      <div id="progress-text">Chargement...</div>
      <div id="question-texte">Connexion aux données...</div>
      <div id="choices-container" class="choices-grid"></div>
      <div id="nav-container"></div>
    </div>

    <div id="resultats">
      <h2>Votre bilan philosophique</h2>
      <div id="affinites-container"></div>
      <div id="alertes-dissonance" style="display: none;">
        <h3 style="margin-top:0; color: #d35400;">Tensions détectées :</h3>
        <div id="alertes-liste"></div>
      </div>
      <button class="btn-choix" style="margin-top: 40px; border-color: var(--primary); font-weight: bold;" onclick="recommencerSondage()">↺ Refaire le test</button>
    </div>
  </div>

  <script>
    let toutesQuestions = [];
    let reglesDissonance = [];
    let fileAttente = []; 
    let indexCourant = 0;
    let reponsesUtilisateur = {}; // Passé en let pour pouvoir être réinitialisé

    const elSondage = document.getElementById("sondage");
    const elQuestionTexte = document.getElementById("question-texte");
    const elChoicesContainer = document.getElementById("choices-container");
    const elNavContainer = document.getElementById("nav-container");
    const elProgress = document.getElementById("progress-text");
    const elResultats = document.getElementById("resultats");

    async function initApp() {
      try {
        const reponse = await fetch('sondage.json');
        if (!reponse.ok) throw new Error("Erreur HTTP: " + reponse.status);
        
        const data = await reponse.json();
        toutesQuestions = data.questions;
        reglesDissonance = data.dissonances;
        
        const questionIdentite = toutesQuestions.find(q => q.type === "identite");
        if (questionIdentite) {
          fileAttente.push(questionIdentite);
          afficherQuestion();
        } else {
          throw new Error("Question d'identité introuvable.");
        }
      } catch (erreur) {
        console.error("Erreur :", erreur);
        elQuestionTexte.textContent = "Impossible de charger sondage.json. Assurez-vous de l'avoir créé dans le même dossier sur GitHub.";
      }
    }

    function afficherQuestion() {
      const q = fileAttente[indexCourant];
      elQuestionTexte.textContent = q.texte;
      elChoicesContainer.innerHTML = ""; 
      elNavContainer.innerHTML = ""; 

      if (q.type === "identite") {
        elProgress.textContent = "Introduction";
        q.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "btn-choix";
          btn.textContent = opt.label;
          btn.onclick = () => traiterIdentite(opt.valeur, q.id);
          elChoicesContainer.appendChild(btn);
        });
      } else {
        elProgress.textContent = `Question ${indexCourant} / ${fileAttente.length - 1}`;
        const echelle = [
          { val: 2, label: "Tout à fait d'accord" },
          { val: 1, label: "Plutôt d'accord" },
          { val: 0, label: "Neutre / Sans opinion" },
          { val: -1, label: "Plutôt pas d'accord" },
          { val: -2, label: "Pas du tout d'accord" }
        ];

        echelle.forEach(item => {
          const btn = document.createElement("button");
          btn.className = "btn-choix";
          btn.setAttribute("data-val", item.val);
          btn.textContent = item.label;
          btn.onclick = () => enregistrerChoix(item.val, q.id);
          elChoicesContainer.appendChild(btn);
        });

        if (indexCourant > 0) {
          const btnRetour = document.createElement("button");
          btnRetour.className = "btn-retour";
          btnRetour.textContent = "← Revenir à la question précédente";
          btnRetour.onclick = questionPrecedente;
          elNavContainer.appendChild(btnRetour);
        }
      }
    }

    function traiterIdentite(valeurIdentite, qId) {
      reponsesUtilisateur[qId] = valeurIdentite;
      
      const crashTests = toutesQuestions.filter(q => 
        q.type === "crash_test" && q.cible_identite === valeurIdentite
      );
      const questionsStandards = toutesQuestions.filter(q => q.type === "standard");
      
      fileAttente = [fileAttente[0], ...crashTests, ...questionsStandards];
      indexCourant++;
      afficherQuestion();
    }

    function enregistrerChoix(valeur, qId) {
      reponsesUtilisateur[qId] = valeur;
      indexCourant++;
      if (indexCourant < fileAttente.length) {
        afficherQuestion();
      } else {
        terminerSondage();
      }
    }

    function questionPrecedente() {
      if (indexCourant > 0) {
        indexCourant--;
        afficherQuestion();
      }
    }

    // Nouvelle fonction pour redémarrer le sondage
    function recommencerSondage() {
      // 1. Réinitialisation des variables
      indexCourant = 0;
      reponsesUtilisateur = {};
      
      const questionIdentite = toutesQuestions.find(q => q.type === "identite");
      fileAttente = [questionIdentite];

      // 2. Nettoyage de l'écran des résultats
      document.getElementById("affinites-container").innerHTML = "";
      document.getElementById("alertes-liste").innerHTML = "";
      document.getElementById("alertes-dissonance").style.display = "none";
      
      // 3. Bascule des écrans
      elResultats.style.display = "none";
      elSondage.style.display = "block";

      // 4. Relance
      afficherQuestion();
    }

    function calculerAffinities(reponses) {
      const totaux = {};
      const maxPossibles = {};

      for (const [qId, valeurChoisie] of Object.entries(reponses)) {
        if (qId === "q_identite") continue; 
        
        const question = toutesQuestions.find(q => q.id === qId);
        if (question && question.scores) {
          for (const [profil, poids] of Object.entries(question.scores)) {
            if (!totaux[profil]) {
              totaux[profil] = 0;
              maxPossibles[profil] = 0;
            }
            totaux[profil] += poids * valeurChoisie;
            maxPossibles[profil] += Math.abs(poids) * 2;
          }
        }
      }

      const resultats = [];
      for (const profil in totaux) {
        if (maxPossibles[profil] > 0) {
          let pourcentage = Math.max(0, (totaux[profil] / maxPossibles[profil]) * 100);
          resultats.push({ profil: profil, pourcentage: Math.round(pourcentage) });
        }
      }
      return resultats.sort((a, b) => b.pourcentage - a.pourcentage);
    }

    function genererBilanDissonance(reponses) {
      const anomalies = [];
      reglesDissonance.forEach(regle => {
        try {
          const evaluateur = new Function("rep", "return " + regle.condition + ";");
          if (evaluateur(reponses)) {
            anomalies.push(regle.message);
          }
        } catch (e) {
          console.warn("Règle ignorée", regle.code);
        }
      });
      return anomalies;
    }

    function terminerSondage() {
      elSondage.style.display = "none";
      elResultats.style.display = "block";
      
      const affinites = calculerAffinities(reponsesUtilisateur);
      const containerScores = document.getElementById("affinites-container");
      
      affinites.forEach(aff => {
        if (aff.pourcentage > 0) {
          containerScores.innerHTML += `
            <div class="resultat-item">
              <div class="resultat-header">
                <span>${aff.profil}</span>
                <span>${aff.pourcentage}%</span>
              </div>
              <div class="barre-fond">
                <div class="barre-remplissage" style="width: ${aff.pourcentage}%;"></div>
              </div>
            </div>
          `;
        }
      });

      const alertes = genererBilanDissonance(reponsesUtilisateur);
      if (alertes.length > 0) {
        const divAlertes = document.getElementById("alertes-dissonance");
        const listeAlertes = document.getElementById("alertes-liste");
        divAlertes.style.display = "block";
        
        alertes.forEach(alerteTexte => {
          listeAlertes.innerHTML += `<div class="alerte-item">- ${alerteTexte}</div>`;
        });
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
